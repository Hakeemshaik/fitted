<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Fitted</title>
<meta name="description" content="Your closet, styled daily.">
<meta name="theme-color" content="#F2EDE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fitted">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="app.css">
</head><body>
<div class="app" id="app">
  <main id="screens"></main>
  <div class="topfade"></div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <p class="barhint" id="barhint">Swipe up on the bar to ask your stylist</p>
    <div class="bar " id="bar"><button class="grab" id="grab" type="button" aria-label="Open the stylist chat"><i></i></button><div class="tabs" id="tabs"></div></div>
  </nav>

  <div class="chatdim" id="chatdim"></div>
  <section class="chat" id="chat" aria-hidden="true" aria-label="Stylist chat">
    <div class="chead" id="chead">
      <span class="grab2"></span>
      <div class="ctitle"><h4>Your <em>stylist</em></h4><p id="aistatus"><i></i>Style rules</p></div>
      <button class="circ " id="chatClose" type="button" aria-label="Close chat"></button>
    </div>
    <div class="cbody" id="cbody"></div>
    <form class="comp " id="comp">
      <input id="q" type="text" placeholder="Ask about your closet…" autocomplete="off" enterkeyhint="send" aria-label="Message">
      <button class="circ" id="mic" type="button" aria-label="Speak"></button>
      <button class="send" type="submit" aria-label="Send"></button>
    </form>
  </section>

  <div class="sheetwrap" id="sheetwrap"><div class="bd" id="sheetbd"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast " id="toast" role="status"></div>
  <div id="onbHost"></div>
</div>
<script type="module" src="src/main.js"></script>
</body></html>
